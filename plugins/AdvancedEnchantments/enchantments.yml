  description: "Умножает получаемый опыт."
  applies-to: "Tools;Swords"
  type: "MINING;ATTACK_MOB"
  group: "SIMPLE"
  applies:
    - ALL_PICKAXE
    - ALL_SPADE
    - ALL_AXE
    - ALL_SWORD
  levels:
    1:
      chance: 15
      cooldown: 1
      effects:
        - "EXP:<random number>2-5</random number>"
    2:
      chance: 30
      cooldown: 2
      effects:
        - "EXP:<random number>2-5</random number>"
    3:
      chance: 45
      cooldown: 3
      effects:
        - "EXP:<random number>2-5</random number>"
