dodge:
  display: "&7Уклонение"
  description: "Chance to dodge physical enemy,\nchance increases when sneaking."
  applies-to: "Armor"
  type: "DEFENSE"
  group: "SIMPLE"
  applies:
    - ALL_ARMOR
  levels:
    1:
      chance: 7
      cooldown: 8
      condition:
        - "%victim is sneaking% = true : %chance%+7"
      effects:
        - "STOP_ATTACK"
        - "PLAY_SOUND:ENTITY_GHAST_SCREAM"
    2:
      chance: 12
      cooldown: 8
      condition:
        - "%victim is sneaking% = true : %chance%+7"
      effects:
        - "STOP_ATTACK"
        - "PLAY_SOUND:ENTITY_BAT_TAKEOFF:0.7 %victim%"
