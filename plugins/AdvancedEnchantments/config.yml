    sound: LEVEL_UP
  display-right-click-message: true
  type: BOOK
  id: 0
  custom-model-data: 0
  force-glow: false
  name: '%group-color%&l%group-name%&l Enchantment Book &7(Right Click)'
  lore:
  - '&7Right Click while holding to receive a random'
  - '%group-color%%group-name% &7enchantment book.'
