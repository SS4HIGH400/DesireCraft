# -------- Permissions --------
# 
# "worldborder.help": Allows access to the help command.
# "worldborder.set": Allows players to set a world border.
# "worldborder.delete": Allows players to remove a world border.
# "worldborder.reload": Allows players to reload the plugin configuration.
# "worldborder.*": Gives access to all Main commands.
