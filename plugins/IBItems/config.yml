sound:
  items-receiver: ENTITY_CHICKEN_EGG #Звук когда игрок получает предмет
  disorientation-event: ENTITY_ILLUSIONER_MIRROR_MOVE #Звук использования дезориентации
  dust-event: ENTITY_ILLUSIONER_PREPARE_BLINDNESS #Звук использования явной пыли
