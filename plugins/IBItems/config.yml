  plast-event: BLOCK_PISTON_CONTRACT #Звук использования пласта
  plast-expire: ENTITY_ZOMBIE_BREAK_WOODEN_DOOR #Звук когда остается 3 секунды
  plast-end: ENTITY_ZOMBIE_ATTACK_WOODEN_DOOR #Звук окончания пласта
