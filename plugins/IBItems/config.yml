#ibitems-trap - флаг на запрет трапки в регионе
#ibitems-plast - флаг на запрет пласта в регионе
#ibitems-dust - флаг на запрет явной пыли в регионе
#ibitems-disorientation - флаг на запрет дезориентации в регионе
#ibitems-snowball - флаг на запрет снежок заморозка в регионе

trap:
  material: NETHERITE_SCRAP #Материал
  slab-type: POLISHED_BLACKSTONE_BRICK_SLAB #Материал полу-блоков
  crying-obsidian-chance: 65 #Шанс плачущего обсидиана
  enchanted: false #Свечение предмета
  delay: 30 #Действия, трапки в сек.
  cooldown: 60 #Кулдаун на трапку в сек.
  animation-speed: 1 #Задержка в тиках для анимации. 1 тик = 0.05 секунды. По умолчанию 2 тика = 0.1 секунды
  name: '#A30EE2[🔥] #CC79EFТ#D694F2р#E0AFF5а#EBC9F9п#F5E4FCк#FFFFFFа'
  lore: [] #Описание предмета
  enable-crafting: true
  settings-recipe: #Настройки крафта
    key: #Можно создавать множество ключей с материалами
      A: OBSIDIAN
      B: CRYING_OBSIDIAN
      C: NETHERITE_SCRAP
    pattern:
      - ABA
      - BCB
      - ABA
  flags: #Флаги для региона трапка
    pvp: allow
    block-break: deny
    block-place: deny
    ibitems-trap: deny
    ibitems-plast: deny

bossbar: #bossbar на трапку
