# You can spawn the effect before the airdrop appears, but the location must be pre-generated! The parameter "search-before-start" is responsible for that.
effects:
  ef=1: 
    type: CIRCLE 
    ticks: 36000 
    timeUpdate: 10 
    radius: 1.0
    count: 0 
    viewDistance: 30 
    step: 0.05 
    offset-x: 0.5 
    offset-y: 0.3
    offset-z: 0.5
    number-of-steps: 6.5 
    particle: REDSTONE
    #only REDSTONE# 
    size: 2
    color-rgb-r: 255
    color-rgb-g: 71
    color-rgb-b: 4
