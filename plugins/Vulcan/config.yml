prefix: '&7[&d&lTS&7] &8»&f'
alerts:
  format: '%prefix% %severity%%player% &fподозревается в %severity%%check% %dev%&f(%severity%%type%&f)%dev%
    &f[%severity%%vl%&f/%severity%%max-vl%&f]'
  hover-message:
  - ''
  - '&fПинг: &c%ping% &8| &fTPS: &c%tps% &8| &fВерсия: &c%version% &8| &fКлиент: &c%client-brand%'
  - ''
  - '&fОписание:'
  - '&f%description%'
  - ''
  - '&fИнформация:'
  - '&f%info%'
  - ''
  - '&fНажмите, чтобы телепортироваться.'
  - ''
  click-commands:
  - /vulcan clickalert %player%
  click-alert-command-commands:
  - tp %player%
  toggled-on-message: '%prefix% &fУведомления &aвключены&f!'
  toggled-off-message: '%prefix% &fУведомления &cвыключены&f!'
  print-to-console: true
  console-format: '[AC] %player% подозревается в %check% %dev%(%type%)%dev% (%vl%/%max-vl%)'
  custom-commands: []
  severity:
    violations:
      '2': 4
      '3': 8
      '4': 12
      '5': 16
      '6': 16
      '7': 16
      '8': 16
      '9': 16
      '10': 16
    colors:
      '1': '#FB08EB'
      '2': '#FB08EB'
      '3': '#FB08EB'
      '4': '#FB08EB'
      '5': '#FB08EB'
      '6': '#FB08EB'
      '7': '#FB08EB'
      '8': '#FB08EB'
      '9': '#FB08EB'
      '10': '#FB08EB'
  experimental-symbol: '*'
verbose:
  format: '%prefix% &c%player% &fподозревается в &c%check% &f(&r%type%&f) %dev% &f[&a%percent%%&f]'
  hover-message:
  - ''
  - '&fПинг: &c%ping% &8| &fTPS: &c%tps% &8| &fВерсия: &c%version%'
  - ''
  - '&fОписание:'
  - '&f%description%'
  - ''
  - '&fБуфер:'
  - '&f%buffer%/%max-buffer%'
  - ''
  - '&fНажмите, чтобы телепортироваться.'
  - ''
  click-commands:
  - /tp %player%
  toggled-on-message: '%prefix% &fДополнительная проверка &aвключена&f!'
  toggled-off-message: '%prefix% &fДополнительная проверка &cвыключена&f!'
log-file:
  enabled: false
  alert-message: '%player% failed %check% %dev%(Type %type%)%dev% [VL: %vl%] [Ping:
    %ping%] [TPS: %tps%] [Version: %version%] [Client: %client-brand%]'
  punishment-message: '%player% был кикнут за %check% %dev%(%type%)%dev% [VL: %vl%]
    [Пинг: %ping%] [TPS: %tps%] [Клиент: %client-brand%]'
unloaded-chunks:
  setback-enabled: true
  message: '%prefix% &f%player% &7попытался войти в незагруженный чанк.'
  max-ticks: 40
punishment-file:
  enabled: true
violation-reset:
  enabled: true
  interval-in-minutes: 8
  message-enabled: false
  message: '%prefix% &7Обнаружения для всех онлайн-игроков были сброшены!'
client-brand-alerts:
  resolve: true
  enabled: true
  ignore-alerts-list:
  - vanilla
  message: '%prefix% &fИгрок &6%player% &fиспользует клиент &e%client-brand%&f!'
  blocked-client-brands: []
  unallowed-client-brand-kick-message: '&fПодключение с &a%client-brand% &fневозможно!'
  console: false
  console-message: '[Vulcan] %player% использует %client-brand%!'
  whitelist-enabled: false
  whitelisted-client-brands: []
connection:
  desync:
    kick-enabled: true
    max-ticks: 300
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &fwas kicked for being out of sync with
      the server! &f(&c%ticks% &fticks)'
    console-message: '[Vulcan] &c%player% &fwas kicked for being out of sync with
      the server! &f(&c%ticks% &fticks)'
  transaction:
    kick-enabled: true
    max-delay: 45000
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &fwas kicked for not replying to Transaction
      Packets! &f(&c%delay%ms&f)'
    console-message: '[Vulcan] &c%player% &fwas kicked for not replying to Transaction
      Packets! &f(&c%delay%ms&f)'
  keepalive:
    kick-enabled: true
    max-delay: 45000
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &fwas kicked for not replying to KeepAlive
      Packets! &f(&c%delay%ms&f)'
    console-message: '[Vulcan] &c%player% &fwas kicked for not replying to KeepAlive
      Packets! &f(&c%delay%ms&f)'
  max-ping:
    kick-enabled: true
    max-ping: 20000
    max-ticks: 20
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &fwas kicked for having too high ping!
      &f(&c%ping%ms&f)'
    console-message: '[Vulcan] &c%player% &fkicked for having too high ping! &f(&c%ping%ms&f)'
punishments:
  message: '%prefix% &6%player% &fбыл кикнут за &6%check% &f(&6%type%&f) &f[&6x%vl%&f]'
  broadcast:
  - '&f'
  - '&cVulcan &fhas detected &c%player% &fto be cheating and has removed them from
    the network.'
  - '&f'
judgement-days:
  started-broadcast:
  - '&f'
  - '&cVulcan Judgement Day v1 has commenced...'
  - '&f'
  ended-broadcast:
  - '&f'
  - '&cThe Judgement Day has ended... %amount% players were punished.'
  - '&f'
  commands:
  - ban %player% -s 3.1 (Анти-Чит)
  broadcast:
  - '&f'
  - '&c%player% &fwas banned for &c[Vulcan] Judgement Day v1&f.'
  - '&f'
  cooldown: 1000
  run-at-interval: false
  interval: 36000
freeze:
  logged-out-while-frozen-commands: []
gui:
  title: Vulcan AntiCheat
ghost-blocks-fix:
  enabled: true
  ghost-water-fix: true
  minimum-tps: 18.5
  buffer:
    max: 3
    decay: 0.1
  setback: true
  update-blocks: false
  ticks: 3
  message-enabled: false
  message: '%prefix% &fВы двигались по призрачному блоку. Он был обновлён.'
  staff-message-enabled: true
  staff-message: '%prefix% &c%player% &fходит по призрачным блокам (%world%, %x%,
    %y%, %z%) &f[%ticks%]'
  print-to-console: false
  console-message: '%player% position was updated for being on a ghost block! (%world%,
    %x%, %y%, %z%) &f[%ticks%]'
messages:
  no-permission: '%prefix% &fНет прав.'
  cant-execute-from-console: '%prefix% &fТолько игрок может выполнить команду.'
  ban-command-syntax: '%prefix% &fИспользование: &c/vulcan ban (никнейм)&f.'
  kb-command-syntax: '%prefix% &fИспользование: &c/vulcan knockback (никнейм) &8|
    &c/vulcan kb (никнейм)&f.'
  profile-command-syntax: '%prefix% &fИспользование: &c/vulcan profile (никнейм)&f.'
  jday-command-syntax: '%prefix% &fИспользование: &c/jday add (никнейм) &8| &c/jday
    execute &8| &c/jday list &8| &c/jday remove (никнейм)&f.'
  reload-success: '%prefix% &fSuccessfully reloaded Vulcan!'
  invalid-target: '%prefix% &cThe specified player could not be found!'
  kb-test-success: '%prefix% &fSuccessfully performed knockback test on %player%!'
  jday-no-pending-bans: '%prefix% &cThere are no pending bans!'
  jday-added-to-list: '%prefix% &c%player% &fwas successfully added to the list!'
  reset-command: '%prefix% &fViolations for all online players were reset!'
  no-next-page: '%prefix% &cThere is no next page!'
  no-previous-page: '%prefix% &cThere is no previous page!'
  enabled-all-checks: '%prefix% &fEnabled all checks!'
  disabled-all-checks: '%prefix% &cDisabled all checks!'
  enabled-all-punishments: '%prefix% &fEnabled all punishments!'
  disabled-all-punishments: '%prefix% &cDisabled all punishments!'
  disabled-check: '%prefix% &cDisabled check %check%!'
  enabled-check: '%prefix% &fEnabled check %check%!'
  disabled-punishment: '%prefix% &cDisabled punishment for %check%!'
  enabled-punishment: '%prefix% &fEnabled punishment for %check%!'
  disabled-hotbar-shuffle: '%prefix% &cHotbar shuffle for %check% disabled!'
  enabled-hotbar-shuffle: '%prefix% &fHotbar shuffle for %check% enabled!'
  disabled-random-rotation: '%prefix% &cRandom rotation for %check% disabled!'
  enabled-random-rotation: '%prefix% &fRandom rotation for %check% enabled!'
  disabled-broadcast-punishment: '%prefix% &cBroadcast punishment for %check% disabled!'
  enabled-broadcast-punishment: '%prefix% &fBroadcast punishment for %check% enabled!'
  must-be-an-integer: '&cMust be an integer!'
  must-be-positive: '&cMust be positive!'
  must-be-number: '&cMust be a number!'
  set-max-buffer: '%prefix% &fSet max buffer for %check% to %value%!'
  set-hotbar-shuffle-minimum-violations: '%prefix% &fSet minimum violations to shuffle
    hotbar for %check% to %value%!'
  set-hotbar-shuffle-interval: '%prefix% &fSet hotbar shuffle interval for %check%
    to %value%!'
  set-random-rotation-minimum-violations: '%prefix% &fSet minimum violations to randomly
    rotate for %check% to %value%!'
  set-random-rotation-interval: '%prefix% &fSet random rotation interval for %check%
    to %value%!'
  set-alert-interval: '%prefix% &fSet alert interval for %check% to %value%!'
  set-buffer-decay: '%prefix% &fSet buffer decay for %check% to %value%!'
  set-buffer-multiple: '%prefix% &fSet buffer multiple for %check% to %value%!'
  set-max-violations: '%prefix% &fSet max violations for %check% to %value%!'
  set-minimum-violations-to-alert: '%prefix% &fSet minimum violations to alert for
    %check% to %value%!'
  set-maximum-ping: '%prefix% &fSet maximum ping for %check% to %value%!'
  set-minimum-tps: '%prefix% &fSet minimum TPS for %check% to %value%!'
  removed-punishment-command: '%prefix% &fRemoved command %command% from check %check%!'
  invalid-index-number: '%prefix% &cInvalid index number!'
  stopped-editing-punishment-commands: '%prefix% &cStopped editing punishment commands!'
  added-punishment-command: '%prefix% &fAdded punishment command %command% to check
    %check%!'
  enter-punishment-command: '%prefix% &fEnter the command you want to add! Type STOP
    or CANCEL to exit!'
  remove-punishment-command: '%prefix% &cEnter the index of the command you want to
    remove. Type STOP or CANCEL to exit!'
  disable-check-command-syntax: '%prefix% &fИспользование: &c/vulcan disablecheck
    (check name) - case sensitive.'
  invalid-check: '%prefix% &cInvalid check name! Examples: AimA, BadPacketsF, AutoClickerJ.'
  removed-check: '%prefix% &cDisabled check %check%!'
  violations-command-syntax: '%prefix% &fИспользование: &c/vulcan violations (никнейм)'
  no-logs: '%prefix% &cThis player set off no logs!'
  cps-command-syntax: '%prefix% &fИспользование: &c/vulcan cps (никнейм)'
  connection-command-syntax: '%prefix% &fИспользование: &c/vulcan connection (никнейм)'
  logs-command-syntax: '%prefix% &fИспользование: &c/logs (никнейм) (page)'
  no-logs-file: '%prefix% &cThere is no logs file!'
  logs-command-no-logs: '%prefix% &cThere were no logs found for %player%!'
  no-page: '%prefix% &cThere is no page %page% for %player%!'
  update-available: '%prefix% &fA new update for &cVulcan &fis available! (&cv%new-version%&f)'
  latest-version: '%prefix% &fYou are running the latest version of Vulcan!'
  injection-failure: You joined too quickly. Please try again!
  frozen: '&cYou are frozen! Please await instructions from staff.'
  logged-out-while-frozen: '%prefix% &c%player% logged out while frozen!'
  froze: '%prefix% &fYou froze &a%player%&f!'
  unfroze: '%prefix% &fYou unfroze &c%player%!'
  freeze-command-syntax: '%prefix% &fИспользование: &c/vulcan freeze (никнейм)'
  shuffle-command-syntax: '%prefix% &fИспользование: &c/vulcan shuffle (никнейм)'
  shuffled-hotbar: '%prefix% &fSuccessfully shuffled hotbar for %player%!'
  rotate-command-syntax: '%prefix% &fИспользование: &c/vulcan rotate (никнейм)'
  randomly-rotated: '%prefix% &fSuccessfully rotated %player%!'
  reset-command-syntax: '%prefix% &fИспользование: &c/vulcan reset (никнейм)'
  violations-reset: '%prefix% &fSuccessfully reset violations for %player%!'
  unknown-command: '%prefix% &cUnknown command!'
  unfroze-staff-broadcast: '%prefix% &c%player% &fwas unfrozen by &c%staff%&f!'
  froze-staff-broadcast: '%prefix% &c%player% &fwas frozen by &c%staff%&f!'
  removed-from-jday: '%prefix% &fSuccesfully removed %player% from Judgement Day!'
  jday-remove-syntax: '%prefix% &fИспользование: &c/jday remove (никнейм)'
  punishlogs-syntax: '%prefix% &fИспользование: &c/punishlogs (никнейм)'
  sent-test-alert: '%prefix% &fSuccessfully executed a test alert!'
commands:
  help:
  - '&f'
  - '&cCheat Detection &fv%version% by &cfrep'
  - '&r'
  - '&c/vulcan help &8- &fOpens this help menu'
  - '&c/vulcan menu &8| &c/vulcan gui &8- &fOpen Vulcan''s GUI'
  - '&c/vulcan profile &8 - &fShow''s a player''s Vulcan profile.'
  - '&c/vulcan ban (никнейм) &8- &fBan a player through Vulcan.'
  - '&c/vulcan reload &8- &fReload all files.'
  - '&c/vulcan disablecheck (check) &8- &fDisables a check (case sensitive).'
  - '&c/vulcan violations (никнейм) &8- &fShows all violations of the specified player.'
  - '&c/vulcan cps (никнейм) &8- &fDisplays the CPS of the player.'
  - '&c/vulcan kb (никнейм) &8 | &c/vulcan knockback (никнейм) &8- &fApplies knockback
    to a player.'
  - '&c/vulcan checks &8- &fShows all enabled checks.'
  - '&c/vulcan connection (никнейм) &8- &fShows connection info of the player.'
  - '&c/vulcan freeze (никнейм) &8- &fFreezes/unfreezes a player.'
  - '&c/vulcan rotate (никнейм) &8- &fRandomly rotates a player''s yaw/pitch.'
  - '&c/vulcan shuffle (никнейм) &8- &fRandomly shuffle a player''s hotbar slot.'
  - '&c/vulcan top &8- &fDisplay the players with highest violations for each category.'
  - '&c/vulcan testalert &8- &fTests Discord webhooks/integration.'
  - '&r'
  - '&c/jday add (никнейм) &8- &fAdds a player to Judgement Day.'
  - '&c/jday execute &8- &fExecutes a Judgement Day.'
  - ''
  - '&c/verbose &8- &fTurn on and off verbose notifications.'
  - '&c/alerts &8- &fTurn on and off cheat alerts.'
  - ''
  - '&c/logs (никнейм) (page) &8- &fRead a player''s violations.'
  - '&c/punishlogs (никнейм) &8- &fCheck a player''s punishments'
  - '&f'
  ban:
    commands:
    - ban %player% -s 3.1 (Анти-Чит)
    broadcast:
    - '&f'
    - '&cVulcan &fhas detected &c%player% -s &fto be cheating and has removed them
      from the network.'
    - '&f'
  profile:
  - '&f'
  - '&cVulcan Profile for %player%:'
  - ' &8» &f%uuid%'
  - ''
  - '&fVersion: &c%client-version%'
  - '&fClient Brand: &c%client-brand%'
  - '&fSensitivity: &c%sensitivity%%'
  - '&fLast CPS: &c%cps% CPS'
  - ''
  - '&fTotal Violations (&c%total-violations%&f):'
  - ' &8» &fCombat: &c%combat-violations%'
  - ' &8» &fMovement: &c%movement-violations%'
  - ' &8» &fPlayer: &c%player-violations%'
  - ''
  - '&fCollisions:'
  - '&8» &fNearby Blocks: %nearby-blocks%'
  - '&8» &fNearby Entities: %nearby-entities%'
  - ''
  - '&fPotion Effects: %potion-effects%'
  - '&f'
  cps: '%prefix% &fLast CPS for &c%player%&f: &c%cps%'
  connection:
  - '&f'
  - '&cConnection Information for %player%:'
  - ''
  - '&fTransaction Ping: &c%transaction-ping%ms'
  - '&fKeepAlive Ping: &c%keepalive-ping%ms'
  - ''
  - '&fLast Replied Transaction: &c%last-replied-transaction%ms ago'
  - '&fQueued Transactions: &c%queued-transactions%'
  - ''
  - '&fFlying Delay: &c%flying-delay%ms'
  - '&f'
  logs:
    color: '&f'
    header-footer: '&7'
  top:
  - '&f'
  - '&cTop Total Violations:'
  - ' &8- &f%total-1-name% &f(&c%total-1-violations% VL&f)'
  - ' &8- &f%total-2-name% &f(&c%total-2-violations% VL&f)'
  - ' &8- &f%total-3-name% &f(&c%total-3-violations% VL&f)'
  - ' &8- &f%total-4-name% &f(&c%total-4-violations% VL&f)'
  - ' &8- &f%total-5-name% &f(&c%total-5-violations% VL&f)'
  - ''
  - '&cTop Combat Violations:'
  - ' &8- &f%combat-1-name% &f(&c%combat-1-violations% VL&f)'
  - ' &8- &f%combat-2-name% &f(&c%combat-2-violations% VL&f)'
  - ' &8- &f%combat-3-name% &f(&c%combat-3-violations% VL&f)'
  - ' &8- &f%combat-4-name% &f(&c%combat-4-violations% VL&f)'
  - ' &8- &f%combat-5-name% &f(&c%combat-5-violations% VL&f)'
  - ''
  - '&cTop Movement Violations:'
  - ' &8- &f%movement-1-name% &f(&c%movement-1-violations% VL&f)'
  - ' &8- &f%movement-2-name% &f(&c%movement-2-violations% VL&f)'
  - ' &8- &f%movement-3-name% &f(&c%movement-3-violations% VL&f)'
  - ' &8- &f%movement-4-name% &f(&c%movement-4-violations% VL&f)'
  - ' &8- &f%movement-5-name% &f(&c%movement-5-violations% VL&f)'
  - ''
  - '&cTop Player Violations:'
  - ' &8- &f%player-1-name% &f(&c%player-1-violations% VL&f)'
  - ' &8- &f%player-2-name% &f(&c%player-2-violations% VL&f)'
  - ' &8- &f%player-3-name% &f(&c%player-3-violations% VL&f)'
  - ' &8- &f%player-4-name% &f(&c%player-4-violations% VL&f)'
  - ' &8- &f%player-5-name% &f(&c%player-5-violations% VL&f)'
  - '&f'
  jday:
    list-header-footer: '&f'
    list-format: ' &8- &f%name%'
  punishlogs:
    header-footer: '&f&m---»--*--&r&f[ Punishment Logs for &c%player% &f]&f&m--*--«---'
punishment-statistics-broadcast:
  enabled: false
  interval: 18000
  broadcast:
  - ' &f'
  - ' &fЗа последние 7 дней, &cанти-чит &fобнаружил &c%amount% &fчитеров.'
  - ' &f'
settings:
  toggle-alerts-on-join: true
  per-check-severities: true
  cinematic: false
  debug: false
  check-for-updates: false
  inject-early: true
  max-velocity-ticks: 50
  max-logs-file-size: 7500
  server-name: DesireCraft
  async-alerts: false
  enable-api: false
  update-checker: false
  punishment-delay: 10000
  ignore-floodgate: true
  ignore-flags-geyser-client-brand: false
  join-check-wait-time: 500
  ignore-geyser-uuids: true
  ignore-geyser-prefixes: true
  ignore-geyser-prefix: '*'
  max-alert-violation: 250
  flight-cooldown: 40
  top-command-unresolved: Unresolved
  ignore-if-in-judgement-day: false
  ignore-vivecraft: false
  lenient-scaffolding: true
  bstats: false
  entity-collision: true
  hook-mcmmo: false
  hook-mythicmobs: false
  hook-gsit: true
  hook-brewery: false
  ignore-alerts-over-max-violations: false
  ignore-alerts-over-max-violations-amount: 3
  incompatability-manager: true
  plugin-messaging: true
  dont-setback-lower-positions: false
  min-ticks-existed: 3
  velocity-world-border: false
  entity-cram-fix-enabled: false
  entity-cram-entities-amount: 10
  entity-cram-exempt-ticks: 30
  lenient-elytra-handling: true
  handle-attributes: 84926
discord-webhook:
  cooldown: 84926
  cooldown-reset-ticks: 12000
  cooldown-max-webhooks: 100
  alerts:
    enabled: false
    url: insert-webhook-url-here
    avatar: https://i.imgur.com/JPG1Kwk.png
    thumbnail: http://cravatar.eu/avatar/%name%/64.png
    color-r: 252
    color-g: 140
    color-b: 3
    username: Vulcan
    title: Vulcan Alert
    description: '**%player%** failed %check% %dev%(Type %type%)%dev% [%vl%/%max-vl%]'
    content: ''
    information-field: false
    client-version-field: true
    client-brand-field: true
    server-name-field: false
    description-field: false
    location-field: true
    ping-tps-field: true
  punishments:
    enabled: false
    url: insert-webhook-url-here
    avatar: https://i.imgur.com/JPG1Kwk.png
    thumbnail: http://cravatar.eu/avatar/%name%/64.png
    color-r: 255
    color-g: 0
    color-b: 0
    username: Vulcan
    title: Vulcan Punishment
    description: '**%player%** was punished for %check% (Type %type%) [VL: %vl%]'
    content: ''
    description-field: false
    server-name-field: false
    client-brand-field: false
    client-version-field: false
    ping-tps-field: false
    location-field: false
checks:
  combat:
    aim:
      a:
        enabled: true
        punishable: true
        discord-alert-interval: 1
        broadcast-punishment: false
        max-violations: 1
        alert-interval: 1
        dont-alert-until: 1
        maximum-ping: 3000
        minimum-tps: -1
        punishment-commands:
        - kick %player% 3.1 (Анти-Чит) -s
        buffer:
          max: 3
          multiple: 0.75
          decay: 0.5
        hotbar-shuffle:
          enabled: true
          minimum-vl-to-shuffle: 2
          shuffle-every: 2
        random-rotation:
