settings:
  tg:
    enable: true
    token: "ВАШ ТОКЕН"
    ids:
      - ВАШ_АЙДИ
  vk:
    enable: true
    token: "ВАШ ТОКЕН"
    ids:
      - ВАШ_АЙДИ
  time:
    format: "HH:mm || dd.MM"

messages:
  reload-config: "&aКонфиг успешно перезагружен!"
  no-permission: "&cНедостаточно прав"
  help:
    - "&fИнформация о командах:"
    - "&e/%command% reload"
  none: "OFFLINE"
  permanently: "НАВСЕГДА"
  none-player: "OFFLINE"
  none-time: "НАВСЕГДА"
  ban:
    - "[🔔] Игрок был заблокирован на сервере. (Type: BAN)"
    - " "
    - "🚧 Нарушитель: %player%"
    - "⚒ Выдал наказание: %exec_player%"
    - "📕 Причина: %reason%"
    - "🗓 Выдано: %time%"
    - "💥 Действует до: %time_end%"
    #- "✏️ Тип наказания: %type%"
    - "📡 На сервере: %server%"
    - ""
    - "🔒 Скрыто: %isSilent%"
    - "📀 По IP: %isIp%"
  unban:
    - "[🔔] Игрок был разблокирован на сервере. (Type: unBAN)"
    - " "
    - "🚧 Нарушитель: %player%"
    - "⚒ Снял наказание: %exec_player%"
    - "📡 На сервере: %server%"
    - ""
    - "🔒 Скрыто: %isSilent%"
    - "📀 По IP: %isIp%"
  mute:
    - "[🔔] Игрок лишился возможности писать в чат на сервере. (Type: MUTE)"
    - " "
    - "🚧 Нарушитель: %player%"
    - "⚒ Выдал наказание: %exec_player%"
    - "📕 Причина: %reason%"
    - "🗓 Выдано: %time%"
    - "💥 Действует до: %time_end%"
    #- "✏️ Тип наказания: %type%"
    - "📡 На сервере: %server%"
    - ""
    - "🔒 Скрыто: %isSilent%"
    - "📀 По IP: %isIp%"
  unmute:
    - "[🔔] Игроку вернули возможность писать в чат. (Type: unMUTE)"
    - " "
    - "🚧 Нарушитель: %player%"
    - "⚒ Снял наказание: %exec_player%"
    - "📡 На сервере: %server%"
    - ""
    - "🔒 Скрыто: %isSilent%"
    - "📀 По IP: %isIp%"
  warn:
    - "[🔔] Игрок получил наказание (выговор). (Type: WARN)"
    - " "
    - "🚧 Нарушитель: %player%"
    - "⚒ Выдал наказание: %exec_player%"
    - "📕 Причина: %reason%"
    - "🗓 Выдано: %time%"
    - "💥 Действует до: %time_end%"
    #- "✏️ Тип наказания: %type%"
    - "📡 На сервере: %server%"
    - ""
    - "🔒 Скрыто: %isSilent%"
    - "📀 По IP: %isIp%"
  unwarn:
    - "[🔔] Игроку сняли наказание (выговор). (Type: unWARN)"
    - " "
    - "🚧 Нарушитель: %player%"
    - "⚒ Снял наказание: %exec_player%"
    - "📡 На сервере: %server%"
    - ""
    - "🔒 Скрыто: %isSilent%"
    - "📀 По IP: %isIp%"
  kick:
    - "[🔔] Игрок был выгнан с сервера. (Type: KICK)"
    - " "
    - "🚧 Нарушитель: %player%"
    - "⚒ Выдал наказание: %exec_player%"
    - "📕 Причина: %reason%"
    - "🗓 Выдано: %time%"
    - "📡 На сервере: %server%"
    - ""
    - "🔒 Скрыто: %isSilent%"
    - "📀 По IP: %isIp%"