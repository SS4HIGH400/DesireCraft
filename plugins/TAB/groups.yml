# Формат TAB: <привилегия LuckPerms> <ник> <клан>.
# Если у игрока нет префикса или клана, плейсхолдер вернет пустую строку.
Player:
  tabprefix: "%luckperms-prefix%"
  tagprefix: "%luckperms-prefix%"
  customtabname: "%player%"
  tabsuffix: "%desire_clan%"
  tagsuffix: "%desire_clan%"

_DEFAULT_:
  tabprefix: "%luckperms-prefix%"
  tagprefix: "%luckperms-prefix%"
  customtabname: "%player%"
  tabsuffix: "%desire_clan%"
  tagsuffix: "%desire_clan%"
