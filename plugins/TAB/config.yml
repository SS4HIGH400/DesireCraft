header-footer:
  enabled: true
  designs:
    world-world1:
      display-condition: '%world%=world1'
      header:
      - an example of world with custom
      footer:
      - header/footer and prefix/suffix
    world-world2;world3:
      display-condition: '%world%=world2|%world%=world3'
      header:
      - This is a shared header for
      - world2 and world3
      footer: []
    server-server1:
      display-condition: '%server%=server1'
      header:
      - an example of server with custom header
      footer: []
    default:
      display-condition: '%world%!=disabledworld'
      header:
      - '&r                                                            &r'
      - '&8▾ &#D200FF&lDesireCraft &8▾'
      - '&7Добро пожаловать на DesireCraft!'
      - ''
      - '&fТекущий онлайн режима: &d%online%'
      - '&fВаше соединение &#A2A2A2[&#929292ᴘ&#838383ɪ&#737373ɴ&#646464ɢ&#545454]&f:
        &a%player_ping%'
      - ''
      footer:
      - ''
      - '&fСервер: &#D200FF&lDesireCraft'
      - '&7Приятной игры!'
      - ''
      - '&fВы на режиме: &#F4C4F3&lᴀ&#F5B7F4&lн&#F6A9F5&lᴀ&#F79CF6&lр&#F98FF7&lх&#FA82F8&lи&#FB74F9&lя
        &#FC67FA&l1'
      - ''
tablist-name-formatting:
  enabled: true
  disable-condition: '%world%=disabledworld'
scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: false
  sorting-types:
  - GROUPS:owner,admin,manager,stmoder,moder,sthelper,helper,styoutube,youtube,sponsor,space,sapphire,griefer,deluxe,gothic,traper,wander,default
  - PLACEHOLDER_A_TO_Z:%player%
  case-sensitive-sorting: true
  can-see-friendly-invisibles: false
  disable-condition: '%world%=disabledworld'
playerlist-objective:
  enabled: false
  value: '%ping%'
  fancy-value: '&7Ping: %ping%'
  disable-condition: '%world%=disabledworld'
  title: TAB
  render-type: INTEGER
belowname-objective:
  enabled: false
  disable-condition: '%world%=disabledworld'
  fancy-value-default: NPC
  fancy-value: '&c%health%'
  value: '%health%'
  title: '&cHealth'
prevent-spectator-effect:
  enabled: false
bossbar:
  enabled: false
  toggle-command: /bossbar
  remember-toggle-choice: false
  hidden-by-default: false
  bars:
    ServerInfo:
      style: PROGRESS
      color: '%animation:barcolors%'
      progress: '100'
      text: '&fWebsite: &bDesireCraft'
scoreboard:
  enabled: true
  toggle-command: /asdiplahsdouaishd
  remember-toggle-choice: false
  hidden-by-default: false
  delay-on-join-milliseconds: 0
  scoreboards:
    DesireCraft:
      title: '&8▾ &#D200FF&lDesireCraft &8▾'
      lines:
      - ''
      - '&8 ⋅ &fСтатус &8⇾ %vault_groupprefix%%luckperms_meta_plusik%'
      - ''
      - '&8 ⋅ &fМонеты &8⇾ &#FFEE5E%vault_eco_balance_formatted%$'
      - '&8 ⋅ &fРубины &8⇾ &#971AED%playerpoints_points%ᚹ'
      - ''
      - '%javascript_clan_line%'
      - '&8 ⋅ &fНаиграно &8⇾ &#5EFFD8%statistic_hours_played%ч.'
      - '&8 ⋅ &fВаш пинг &8⇾ &#728EE9%player_ping% ⇆'
      - ''
      - '&8 ⋅ &fУбийств &8⇾ &a%statistic_player_kills% 🗡'
      - '&8 ⋅ &fСмертей &8⇾ &c%statistic_deaths% ✞'
      - ''
      - ' &#D200FF&lDesireCraft'
layout:
  enabled: false
  direction: COLUMNS
  default-skin: mineskin:1753261242
  enable-remaining-players-text: true
  remaining-players-text: '... and %s more'
  empty-slot-ping-value: 1000
  layouts:
    default:
      fixed-slots:
      - '1|&3Website&f:'
      - 2|&bDesireCraft
      - '3|&8&m                       '
      - '4|&3Name&f:'
      - 5|&b%player%
      - '7|&3Rank&f:'
      - '8|Rank: %group%'
      - '10|&3World&f:'
      - 11|&b%world%
      - '13|&3Time&f:'
      - 14|&b%time%
      - '21|&3Teamspeak&f:'
      - 22|&bDesireCraft
      - '23|&8&m                       '
      - '41|&3Store&f:'
      - 42|&bDesireCraft
      - '43|&8&m                       '
      groups:
        staff:
          slots:
          - 24-40
          display-condition: permission:tab.staff
        players:
          slots:
          - 44-80
ping-spoof:
  enabled: false
  value: 0
placeholders:
  date-format: dd.MM.yyyy
  time-format: '[HH:mm:ss / h:mm a]'
  time-offset: 0
  register-tab-expansion: false
  locale: en-US
placeholder-output-replacements:
  '%essentials_vanished%':
    'yes': '&7| Vanished'
    'no': ''
  '%essentials_nickname%':
    '%essentials_nickname%': '%player%'
conditions:
  nick:
    conditions:
    - '%player%=%essentials_nickname%'
    true: '%player%'
    false: ~%essentials_nickname%
assign-groups-by-permissions: false
primary-group-finding-list:
- owner
- admin
- manager
- stmoder
- moder
- sthelper
- helper
- styoutube
- youtube
- sponsor
- space
- sapphire
- griefer
- deluxe
- gothic
- traper
- wander
- default
debug: false
mysql:
  enabled: false
  host: 127.0.0.1
  port: 3306
  database: tab
  username: user
  password: password
per-world-playerlist:
  enabled: false
  allow-bypass-permission: false
  ignore-effect-in-worlds:
  - ignoredworld
  - build
  shared-playerlist-world-groups:
    lobby:
    - lobby1
    - lobby2
    minigames:
    - paintball
    - bedwars
global-playerlist:
  enabled: false
  display-others-as-spectators: false
  display-vanished-players-as-spectators: true
  isolate-unlisted-servers: false
  spy-servers:
  - spyserver1
  - spyserver2
  server-groups:
    lobbies:
    - lobby1
    - lobby2
    group2:
    - server1
    - server2
  update-latency: false
use-bukkit-permissions-manager: false
use-online-uuid-in-tablist: true
permission-refresh-interval: 1000
compensate-for-packetevents-bug: false
placeholder-refresh-intervals:
  default-refresh-interval: 500
  '%server_uptime%': 1000
  '%server_tps_1_colored%': 1000
  '%server_unique_joins%': 5000
  '%player_health%': 200
  '%player_ping%': 1000
  '%vault_prefix%': 1000
  '%rel_factionsuuid_relation_color%': 1000
config-version: 6
components:
  minimessage-support: true
  disable-shadow-for-heads: true
proxy-support:
  channel-name-suffix: TAB
  enabled: false
  type: PLUGIN
  plugin:
    name: RedisBungee
  redis:
    url: redis://:password@localhost:6379/0
  rabbitmq:
    exchange: plugin
    url: amqp://guest:guest@localhost:5672/%2F
