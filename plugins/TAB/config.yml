header-footer:
  enabled: true
  designs:
    default:
      display-condition: '%world%!=disabledworld'
      header:
      - '&#95090c╔═════════════════════════╗'
      - '&#95090c&lD&#92080b&lE&#8f070a&lS&#8b0608&lI&#880507&lR&#850406&lE &#820405&lC&#7f0304&lR&#7b0202&lA&#780101&lF&#750000&lT'
      - '&fРежим: &#95090c&lА&#90080a&lН&#8a0608&lА&#850406&lР&#800304&lХ&#7a0202&lИ&#750000&lЯ'
      - ''
      footer:
      - ''
      - '&fОнлайн: &#95090c%server_online% | &fПинг: &#750000%player_ping%мс'
      - '&fTPS: %server_tps_1_colored%'
      - ''
      - '%animation:Welcome%'
      - '%animation:Welcome2%'
      - '&#750000╚═════════════════════════╝'

tablist-name-formatting:
  enabled: false
  disable-condition: '%world%=disabledworld'

scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: false
  sorting-types:
  - GROUPS:owner,admin,start,youtube,sekscar,karatel,gerakl,gercog,knyaz,princ,titan,elite,glava,squid,aspid,hero,strazh,baron,default
  case-sensitive-sorting: true
  disable-condition: '%world%=disabledworld'
  can-see-friendly-invisibles: false

belowname-objective:
  enabled: false
  disable-condition: '%world%=world|%world%=lobby'
  fancy-value-default: NPC
  fancy-value: '&c%health%'
  value: ' '
  title: ' '

prevent-spectator-effect:
  enabled: false

bossbar:
  enabled: true
  toggle-command: /bossbar
  remember-toggle-choice: false
  hidden-by-default: true
  bars:
    ServerInfo:
      style: PROGRESS
      color: '%animation:barcolor%'
      progress: '%animation:bartext%'
      text: '%animation:bartext%'

per-world-playerlist:
  enabled: false
  allow-bypass-permission: false
  ignore-effect-in-worlds:
  - ignoredworld
  - build
  shared-playerlist-world-groups:
    lobby:
    - spawn
    - lobby2
    minigames:
    - spawn
    - bedwars

scoreboard:
  enabled: true
  toggle-command: /sbtoggle
  remember-toggle-choice: false
  hidden-by-default: false
  delay-on-join-milliseconds: 0
  scoreboards:
    scoreboard1:
      title: '&#95090c&lD&#91080b&lE&#8d0709&lS&#890608&lI&#850406&lR&#810304&lE'
      lines:
      - '&#95090c╔════════════'
      - '&#95090c╠ &fНик: &#95090c%player%'
      - '&#95090c╠ &fРанг: &r%luckperms-prefix%'
      - '&#95090c╠'
      - '&#95090c╠ &fМонеты: &#95090c%cmi_user_balance_formatted%'
      - '&#95090c╠ &fРубины: &#750000%desire_rubies%'
      - '&#95090c╠'
      - '&#95090c╠ &fУбийства: &#95090c%desire_kills%'
      - '&#95090c╠ &fСмерти: &#750000%desire_deaths%'
      - '&#95090c╠ &fЧасы: &#95090c%desire_hours%'
      - '&#750000╚════════════'
ping-spoof:
  enabled: false
  value: 0

placeholders:
  date-format: dd.MM.yyyy
  time-format: '[HH:mm:ss / h:mm a]'
  time-offset: 0
  register-tab-expansion: true
  locale: en-US

placeholder-output-replacements:
  '%essentials_vanish%':
    'yes': '&7| Vanished'
    'no': ''
  '%afk%':
    'true': ' '
    'false': ''
  '%essentials_nickname%':
    '%essentials_nickname%': '%player%'

conditions:
  nick:
    conditions:
    - '%player%=%essentials_nickname%'
    true: '%player%'
    false: ~%essentials_nickname%

assign-groups-by-permissions: false
primary-group-finding-list:
- gercog
- aspid
- hero
- strazh
- baron
- default

debug: false

mysql:
  enabled: false
  host: 127.0.0.1
  port: 3306
  database: tab
  username: user
  password: password

use-online-uuid-in-tablist: true
permission-refresh-interval: 1000

global-playerlist:
  enabled: false
  update-latency: false

layout:
  enabled: false
  direction: COLUMNS
  default-skin: mineskin:1753261242
  enable-remaining-players-text: true
  remaining-players-text: '... and %s more'
  empty-slot-ping-value: 1000
  layouts:
    staff:
      fixed-slots:
      - '1|&3RAM&f:'
      - 2|&b%memory-used%MB / %memory-max%MB
      - '3|&8&m                       '
      - '4|&3TPS&f:'
      - 5|&b%tps%
      groups:
        staff:
          slots:
          - 24-40
          display-condition: permission:tab.staff
        players:
          slots:
          - 44-80
      display-condition: permission:tab.staff
    default:
      fixed-slots:
      - '1|&#95090cDesire&f:'
      - 2|&#750000/donate
      - '3|&8&m                       '
      - '4|&#95090cНик&f:'
      - 5|&b%player%
      - '7|&#95090cРанг&f:'
      - '8|%luckperms-prefix%'
      - '10|&#95090cМир&f:'
      - 11|&b%world%
      - '13|&#95090cВремя&f:'
      - 14|&b%time%
      - '21|&#95090cКлан&f:'
      - 22|%desire_clan%
      - '23|&8&m                       '
      - '41|&#95090cРубины&f:'
      - 42|&#750000%desire_rubies%
      - '43|&8&m                       '
      groups:
        staff:
          slots:
          - 24-40
          display-condition: permission:tab.staff
        players:
          slots:
          - 44-80

playerlist-objective:
  enabled: false
  value: '%ping%'
  disable-condition: '%world%=disabledworld'
  fancy-value: '&7Ping: %ping%'
  title: TAB
  render-type: INTEGER

compensate-for-packetevents-bug: false

placeholder-refresh-intervals:
  default-refresh-interval: 500
  '%server_uptime%': 1000
  '%server_tps_1_colored%': 1000
  '%server_online%': 1000
  '%server_unique_joins%': 5000
  '%player_health%': 200
  '%player_ping%': 1000
  '%vault_prefix%': 1000
  '%luckperms-prefix%': 1000
  '%desire_clan%': 1000
  '%desire_rubies%': 1000
  '%desire_kills%': 1000
  '%desire_deaths%': 1000
  '%desire_hours%': 1000
  '%rel_factionsuuid_relation_color%': 1000

config-version: 6

components:
  minimessage-support: true
  disable-shadow-for-heads: true

proxy-support:
  enabled: false
  type: PLUGIN
  plugin:
    name: RedisBungee
  redis:
    url: redis://:password@localhost:6379/0
  rabbitmq:
    exchange: plugin
    url: amqp://guest:guest@localhost:5672/%2F
  channel-name-suffix: TAB
