cooldown: 3 # ru В cooldown | 1 - 20 секунд, по умолчанию 60 секунд, тоесть 3
            # en In cooldown | 1 - 20 seconds, by default 60 seconds, that is 3
titlebar: true # ru В titlebar если значение - true то сообщения выводятся в titlebar и больше нигде, если в titlebar - false то сообщения выводятся в чате и больше нигде
               # en In titlebar, if the value is true, then messages are displayed in titlebar and nowhere else, if in titlebar - false, then messages are displayed in chat and nowhere else
