sub30:
  command: /sub30
  type: RUN_CONSOLE
  runcmd:
  - '$Script$%if%%luckperms_has_permission_grant.sosihui%==yes'
  - '$text$ &c✕ Вы уже использовали эту возможность!'
  # give sub
  - '$Script$%if%$arg1==give'
  - 'lp user $arg2 parent addtemp plus 30d'
  #########
  - '$text$ &fВы выдали &7[&d&l＋&7] &fигроку &5$arg2'
  # remove sub
  - $Script$%if%$arg1==remove
  - '%PlayerOptions%playSound: BLOCK_LEVER_CLICK'
  - 'lp user $arg2 parent removetemp plus'
  - '$text$ &fВы забрали &7[&d&l＋&7] &fу игрока &5$arg2'
  - '$Script$%else%'
  permission-required: true
  permission-node: sub30.cmd_use
  required_args: 2
  register: true
  error-message: '&cИспользование: &7/sub30 give <ник> &fили &7/sub remove <ник>'
