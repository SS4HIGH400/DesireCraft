settings: 
  # Форматирование текста.
  # LEGACY - цвет с использованием &, MINIMESSAGE - цвет с использованием <цвет>
  # MINIMESSAGE добавлен в более новых версиях.
  serialiser: LEGACY
  # Включить анонимную отправку статистики (пожалуйста, не отключайте).
  enable_metrics: true
  # Проверять наличие обновлений (пожалуйста, не отключайте).
  update_checker: true
  # Включить/отключить модули плагина.
  enable_chat_module: true
  enable_symbol_module: true
  enable_command_module: true
  # Выключение сервера при отключении плагина.
  shutdown_on_disable: false
  
# �?гроки, которых не затронет никакие ограничения (можно оставить пустым для снижения нагрузки).
excluded_players:
  - 'sputn1koff'
  - 'mbly'