#
#  AtomicCheck // 1.12.2 - 1.16.5
#

# Включить ли логи?
logs: true

# Permission: atomiccheck.start
permission:
  # Требуется ли право?
  # (false - Могут использовать /check только те кто в moders)
  enable: true
  moders:
    - sputn1koff

# Сколько времени дается игроку.
time: 600

# Разрешенные команды при проверке.
allowed-commands:
  - 'check'

actions:
  start:
    - ''
  quit:
    - 'ban $player 30d 3.1 (Выход с проверки)'
  approve:
    - ''
  timer:
    - 'ban $player 30d 3.1 (Игнор проверки)'
  confession:
    - 'ban $player 7d 3.1 (Признание)'
  ban:
    - 'ban $player 14d 3.1 (Найдены читы на проверке)'

punish:
  BAN: '&cНайдены ПО'
  TIMER: '&cИстёк таймер'
  APPROVE: '&aПрошёл проверку'
  MLEAVE: '&6Проверяющий вышел'
  DISABLE: '&cОстановка плагина'
  LEFT: '&cВыход с сервера (бан)'
  CONFESSION: '&dПризнание'

no-data: '&cнет данных'

messages:
  chat:
    player: '&4(Проверка) &7[И] &f$user &8- &d$message'
    moder: '&4(Проверка) &c&n[П]&f $moder &8- &d$message'
  prefix: '&7[&d&lTrustCheck&7]'
  ingame: '&cДанную команду можно выполнять только в игре!'
  noPermissions: '&cУ вас недостаточно прав.'
  invalidPlayer: '$p &fИгрок &7$user &fне найден.'
  alreadyInCheck: '$p &fИгрок &7$user &fв данный момент на проверке.'
  moder:
    yourself: '$p &fЖаль, но себя проверять нельзя!'
    bypass: '$p &fДанный игрок входит в составь персонала, поэтому Вам нельзя проверять его!'
    end-current: '$p &fЗакончите текущую проверку, чтобы начать другую.'
    start: '$p &fОтправлен запрос. Ожидайте ответа вашего проверяемого.'
    nobody: '$p &fВ данный момент Вы никого не проверяете.'
    left: '$p &fПроверяемый игрок &7$user &fвышел из игры, и был наказан.'
    approve: '$p &fПроверяемый игрок &7$user &fбыл признан чистым игроком.'
    timer-delete: '$p &fТаймер успешно удалён игроку &7$user&f.'
    time-left: '$p &fТаймер &7$user &fзакончился, и он был наказан.'
    ban: '$p &fУ проверяемого игрока &7$user &fбыли найдены &cзапрещенные ПО &fпри проверке и он наказан Вами.'
    confession: '$p &fПроверяемый &7$user &fпризнался в читах и был наказан несильно.'
    message: '&7Напишите сообщение.'
  player:
    blocked-commands: '&cВ данный момент все команды для Вас заблокированы кроме - /check'
    force-stop: '&a- &fПроверка принудительно остановлена.'
    chat: '&4- &fВы были вызваны на проверку, откройте инвентарь &8- &7/check'
    moder-leave: '&a- &fВаш проверяющий вышел из игры, поэтому проверка принудительно закончилась.'

action-bar: '&7У вас осталось &d$time секунд&7.'